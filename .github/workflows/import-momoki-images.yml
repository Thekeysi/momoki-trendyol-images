name: Import Momoki Images

on:
  push:
    paths:
      - '.github/workflows/import-momoki-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install RAR extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y unrar || sudo apt-get install -y p7zip-full

      - name: Download çizgisiz defter archive
        run: |
          curl -L --fail --retry 4 --retry-delay 2 'https://uc9ccc47462162face2fc22fd970.dl.dropboxusercontent.com/cd/0/get/DI8F2RW1MiMzhCWDD1FlF7w--KyjJQD-BRNeIkbXLjccCQPHekLDcyCjqNFnFCf9Ic1hJ4oBgteO6bRdLZ7crNJdSFy-mnMkLDzZvItf5AvT8ms-r3Eu0PrjRCuuyWPbQ4y9d8mZ9DlPHRNj9wX1vi2gPD241SWfGzBbFhRHoIy5gg/file?c_luid=07ebdfa9' -o cizgisiz.rar

      - name: Extract archive
        run: |
          mkdir -p extracted/cizgisiz
          if command -v unrar >/dev/null 2>&1; then
            unrar x -o+ cizgisiz.rar extracted/cizgisiz/
          else
            7z x -y cizgisiz.rar -oextracted/cizgisiz
          fi

      - name: Normalize filenames without re-encoding images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil, unicodedata

          src_root = Path('extracted/cizgisiz')
          out = Path('images/cizgisiz-defter-20260928')
          out.mkdir(parents=True, exist_ok=True)

          found = []
          for src in src_root.rglob('*.png'):
              stem = unicodedata.normalize('NFC', src.stem).upper().replace(' ', '')
              stem = stem.replace('Ç', 'C')
              m = re.fullmatch(r'MMKCD-?(\d{3})([ABCD])', stem)
              if not m:
                  continue
              num, letter = m.groups()
              dest = out / f'MMKCD-{num}{letter}.png'
              shutil.copyfile(src, dest)
              if src.read_bytes() != dest.read_bytes():
                  raise RuntimeError(f'Byte mismatch: {src} -> {dest}')
              found.append(dest.name)

          if len(found) != 16:
              raise RuntimeError(f'Expected 16 images, got {len(found)}: {found}')
          print('Prepared:', *sorted(found), sep='\n')
          PY

      - name: Commit images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/cizgisiz-defter-20260928
          git commit -m 'Add Momoki çizgisiz defter images' || exit 0
          git push
